name: Check CI infrastructure

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest # Validation must work when ARC itself is broken.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= .github/workflows/*.yml
      - name: Validate mirror scripts
        run: shellcheck infra/arc/mirror/check.sh infra/arc/mirror/start.sh infra/arc/node/check-scale-sets.sh infra/arc/node/helm-plugins/arc-dind-mirror/render.sh infra/arc/dind/arc-dind-start infra/arc/dind/arc-runc
      - name: Render every pinned scale set
        run: infra/arc/node/check-scale-sets.sh
      - name: Validate the Docker Hub mirror and the DinD scripts
        run: |
          ARC_DOCKERHUB_MIRROR_ENV_FILE=/dev/null docker compose -f infra/arc/mirror/compose.yaml config --no-env-resolution --quiet
          python3 -m unittest discover -s infra/arc/mirror -p 'test_*.py'
          python3 -m unittest discover -s infra/arc/dind -p 'test_*.py'
