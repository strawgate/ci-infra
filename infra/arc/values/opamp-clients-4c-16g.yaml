# strawgate/opamp-clients' heavy runners: release test builds, Kani, Miri and
# coverage, TLC. See "opamp-clients" in infra/arc/README.md.
# The existing label is retained during the 12-GiB memory trial.
githubConfigUrl: https://github.com/strawgate/opamp-clients
githubConfigSecret: arc-github-app
runnerScaleSetName: opamp-clients-4c-16g
minRunners: 0
maxRunners: 7
containerMode:
  type: dind
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
template:
  spec:
    runtimeClassName: kata-clh-runtime-rs
    nodeSelector:
      ci-infra/kata-worker: "true"
    tolerations:
      - key: ci-infra/kata-only
        operator: Equal
        value: "true"
        effect: NoSchedule
    resources:
      requests:
        cpu: "4"
        memory: 12Gi
      limits:
        cpu: "4"
        memory: 12Gi
    # A private GHCR package: needs the `ghcr` pull secret (infra/arc/README.md).
    imagePullSecrets:
      - name: ghcr
      - name: dockerhub-public-pulls
    containers:
      - name: runner
        image: ghcr.io/strawgate/ci-infra-opamp-clients-arc-runner:20260929-0f51823
        command: ["/home/runner/run.sh"]
        imagePullPolicy: IfNotPresent
        env:
          - name: PYTHON_CPU_COUNT
            value: "4"
