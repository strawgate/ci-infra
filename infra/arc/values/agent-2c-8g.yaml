githubConfigUrl: https://github.com/strawgate/o11yfleet
githubConfigSecret: arc-github-app
runnerScaleSetName: o11yfleet-agent-2c-8g
minRunners: 0
# This dedicated lane adds up to 2 vCPUs to the regular scale sets; account
# for all repositories' runner limits when checking node capacity.
maxRunners: 1
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
template:
  spec:
    runtimeClassName: kata-clh-runtime-rs
    nodeSelector:
      ci-infra/kata-worker: "true"
    tolerations:
      - key: ci-infra/kata-only
        operator: Equal
        value: "true"
        effect: NoSchedule
    resources:
      requests:
        cpu: "2"
        memory: 8Gi
      limits:
        cpu: "2"
        memory: 8Gi
    # REQUIRED. `image:` below is a private GHCR package, so the node cannot
    # pull it without this secret -- `helm upgrade` against these values
    # before creating it leaves the pods in ErrImagePull. Create it once:
    #   kubectl create secret docker-registry ghcr ... -n arc-runners
    # See infra/arc/README.md.
    imagePullSecrets:
      - name: ghcr
    containers:
      - name: runner
        image: ghcr.io/strawgate/ci-infra-o11yfleet-arc-agent-runner:20260929-0f51823
        command: ["/usr/local/bin/start-dockerd.sh"]
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - name: docker-daemon-config
            mountPath: /etc/docker
            readOnly: true
        securityContext:
          # Required by dockerd and the gh-aw network firewall. This applies
          # only to trusted, GitHub-controlled agent workflow definitions.
          privileged: true
    volumes:
      - name: docker-daemon-config
        configMap:
          name: arc-docker-daemon-config
