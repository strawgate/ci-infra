githubConfigUrl: https://github.com/strawgate/o11yfleet
githubConfigSecret: arc-github-app
runnerScaleSetName: o11yfleet-1c-4g
minRunners: 0
maxRunners: 2
containerMode:
  type: dind
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
template:
  spec:
    runtimeClassName: kata-clh-runtime-rs
    nodeSelector:
      ci-infra/kata-worker: "true"
    tolerations:
      - key: ci-infra/kata-only
        operator: Equal
        value: "true"
        effect: NoSchedule
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "1"
        memory: 4Gi
    # REQUIRED. `image:` below is a private GHCR package, so the node cannot
    # pull it without this secret -- `helm upgrade` against these values
    # before creating it leaves the pods in ErrImagePull. Create it once:
    #   kubectl create secret docker-registry ghcr ... -n arc-runners
    # See infra/arc/README.md.
    imagePullSecrets:
      - name: ghcr
      - name: dockerhub-public-pulls
    containers:
      - name: runner
        image: ghcr.io/strawgate/ci-infra-o11yfleet-arc-runner:20260929-0f51823
        command: ["/home/runner/run.sh"]
        imagePullPolicy: IfNotPresent
        env:
          # The pod's CPU count for what doesn't read the cgroup quota: os.cpu_count
          # and Go before 1.25 (infra/arc/README.md, "DinD containment").
          - name: PYTHON_CPU_COUNT
            value: "1"
          - name: GOMAXPROCS
            value: "1"
        # Shared pnpm store on the node, so `pnpm install` reads packages from
        # local disk instead of restoring a 337MB Actions cache over the
        # node's slow uplink. Mount only: jobs opt in through
        # .github/actions/seed-runner-toolchains. See "Shared pnpm store" in
        # infra/arc/README.md for why this must not be a pod env var.
        volumeMounts:
          - name: pnpm-store
            mountPath: /home/runner/.pnpm-store-shared
    volumes:
      - name: pnpm-store
        hostPath:
          # Created by hand, owned by uid 1001 (runner). `Directory` rather
          # than `DirectoryOrCreate`: a missing dir should fail the pod
          # loudly, not silently create a root-owned one pnpm cannot write.
          path: /data/gha-o11yfleet/arc-kata/pnpm-store
          type: Directory
