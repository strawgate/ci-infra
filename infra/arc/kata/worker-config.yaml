# Physical CI worker: 56 schedulable CPUs and about 192 GiB. The OS keeps
# 0-3,36-39; the eight-vCPU control-plane VM is pinned to 8-11,44-47.
server: https://192.168.122.27:6443
token-file: /etc/rancher/k3s/arc-join-token
node-name: docker-host-kata
node-ip: 192.168.122.1
flannel-iface: virbr0
node-label:
  - ci-infra/kata-worker=true
node-taint:
  - ci-infra/kata-only=true:NoSchedule
kubelet-arg:
  # The k3s reverse tunnel dials the kubelet via loopback. Restrict exposure
  # with the dedicated INPUT chain instead of breaking that tunnel's listener.
  - address=0.0.0.0
  - cpu-manager-policy=static
  - cgroup-driver=cgroupfs
  - topology-manager-scope=pod
  - topology-manager-policy=best-effort
  - reserved-cpus=0-3,8-11,36-39,44-47
  - feature-gates=PodLevelResourceManagers=true
  - system-reserved=cpu=16,memory=122Gi
  - eviction-hard=memory.available<2Gi,nodefs.available<15%,imagefs.available<15%
  - image-gc-high-threshold=75
  - image-gc-low-threshold=65
  - max-pods=80
